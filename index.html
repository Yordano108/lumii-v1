<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="shortcut icon" href="./img/gold-cute-cartoon-stars-emoji-17635.svg" type="image/x-icon" />
    <title>¡Tamagotchi!</title>
    <style type="text/tailwindcss">
        @import "tailwindcss";
        @theme {
            --font-sans: "Pixelify Sans", system-ui, sans-serif;
        }
        /* Limpieza de desbordamientos y optimización táctil */
        body { overflow-x: hidden; width: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        /* Clases de "Hover Forzado" para móviles vía JS */
        .mobile-active-btn {
            transform: scale(1.05) !important;
            background-color: #c3ffee !important;
            color: #190a2c !important;
        }
        .mobile-active-img {
            transform: scale(1.10) !important;
            filter: drop-shadow(0 0 30px rgba(195,255,238,0.8)) !important;
        }
        .mobile-active-row {
            background-color: rgba(195, 255, 238, 0.15) !important;
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-[#240081] via-[#140824] to-[#5b359e] flex items-center justify-center min-h-screen p-2 md:p-4 tracking-widest">

    <div
        class="bg-[#190a2c]/80 border-4 border-[#c3ffee] p-4 md:p-8 rounded-3xl w-full max-w-[95vw] md:max-w-5xl shadow-[0_0_50px_rgba(195,255,238,0.4)] flex flex-col justify-between transition-all duration-300 md:hover:scale-115">

        <div class="flex flex-col md:flex-row gap-6 md:gap-8 items-center md:items-start">

            <div class="w-full md:w-96 text-center flex flex-col items-center">
                <img src="./img/juego.png" id="imagen" alt="Lumi"
                    class="js-img max-w-full h-auto md:w-full transition-all duration-300 cursor-pointer mb-4 drop-shadow-[0_0_20px_rgba(195,255,238,0.5)] md:hover:scale-115" />

                <div
                    class="js-btn bg-[#250082]/50 p-3 border transition-all duration-300 cursor-pointer border-[#c3ffee]/30 w-full md:hover:scale-110">
                    <span id="personalidad"
                        class="text-[10px] md:text-[11px] leading-tight text-left text-[#c3ffee] block break-words">
                        Lumi es una nube de polvo estelar...
                    </span>
                </div>
            </div>

            <div
                class="w-full flex-1 space-y-2 md:space-y-4 text-[#c3ffee] border-2 border-[#c3ffee]/30 rounded-xl p-4 md:p-6">
                <div
                    class="js-row flex justify-between items-center border-b border-[#c3ffee]/10 p-2 transition-all cursor-pointer md:hover:bg-[#c3ffee]/5">
                    <span class="font-black text-[10px] md:text-sm uppercase shrink-0">Felicidad:</span>
                    <span id="felicidad"
                        class="text-sm md:text-xl transition-all md:hover:scale-125 filter drop-shadow-[0_0_8px_#c3ffee] text-right"></span>
                </div>
                <div
                    class="js-row flex justify-between items-center border-b border-[#c3ffee]/10 p-2 transition-all cursor-pointer md:hover:bg-[#c3ffee]/5">
                    <span class="font-black text-[10px] md:text-sm uppercase shrink-0">Salud:</span>
                    <span id="salud"
                        class="text-sm md:text-xl transition-all md:hover:scale-125 filter drop-shadow-[0_0_8px_#c3ffee] text-right"></span>
                </div>
                <div
                    class="js-row flex justify-between items-center border-b border-[#c3ffee]/10 p-2 transition-all cursor-pointer md:hover:bg-[#c3ffee]/5">
                    <span class="font-black text-[10px] md:text-sm uppercase shrink-0">Limpieza:</span>
                    <span id="limpieza"
                        class="text-sm md:text-xl transition-all md:hover:scale-125 filter drop-shadow-[0_0_8px_#c3ffee] text-right"></span>
                </div>
                <div
                    class="js-row flex justify-between items-center border-b border-[#c3ffee]/10 p-2 transition-all cursor-pointer md:hover:bg-[#c3ffee]/5">
                    <span class="font-black text-[10px] md:text-sm uppercase shrink-0">Energía:</span>
                    <span id="energia"
                        class="text-sm md:text-xl transition-all md:hover:scale-125 filter drop-shadow-[0_0_8px_#c3ffee] text-right"></span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 md:flex md:flex-row justify-between gap-2 md:gap-5 mt-6 md:mt-10">
            <button onclick="duchar()"
                class="js-btn bg-[#3f246f] text-[#c3ffee] py-3 md:flex-1 text-[9px] md:text-[10px] uppercase transition-all border border-[#c3ffee]/30 cursor-pointer md:hover:scale-115 md:hover:bg-[#c3ffee] md:hover:text-[#190a2c]">Duchar</button>
            <button onclick="alimentar()"
                class="js-btn bg-[#3f246f] text-[#c3ffee] py-3 md:flex-1 text-[9px] md:text-[10px] uppercase transition-all border border-[#c3ffee]/30 cursor-pointer md:hover:scale-115 md:hover:bg-[#c3ffee] md:hover:text-[#190a2c]">Alimentar</button>
            <button onclick="jugar()"
                class="js-btn bg-[#3f246f] text-[#c3ffee] py-3 md:flex-1 text-[9px] md:text-[10px] uppercase transition-all border border-[#c3ffee]/30 cursor-pointer md:hover:scale-115 md:hover:bg-[#c3ffee] md:hover:text-[#190a2c]">Jugar</button>
            <button onclick="dormir()"
                class="js-btn bg-[#3f246f] text-[#c3ffee] py-3 md:flex-1 text-[9px] md:text-[10px] uppercase transition-all border border-[#c3ffee]/30 cursor-pointer md:hover:scale-115 md:hover:bg-[#c3ffee] md:hover:text-[#190a2c]">Dormir</button>
            <button onclick="reprender()"
                class="js-btn bg-[#3f246f] text-[#c3ffee] py-3 md:flex-1 text-[9px] md:text-[10px] uppercase transition-all border border-[#c3ffee]/30 cursor-pointer md:hover:scale-115 md:hover:bg-[#c3ffee] md:hover:text-[#190a2c]">Regañar</button>
            <button onclick="acariciar()"
                class="js-btn bg-[#3f246f] text-[#c3ffee] py-3 md:flex-1 text-[9px] md:text-[10px] uppercase transition-all border border-[#c3ffee]/30 cursor-pointer md:hover:scale-115 md:hover:bg-[#c3ffee] md:hover:text-[#190a2c]">Acariciar</button>
        </div>
    </div>

    <script src="./app.js"></script>
</body>

</html>
